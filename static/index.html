<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Vaani AI</title>
<script>
  /* Apply the saved theme before first paint (light is the default; dark is opt-in). */
  try { var t = localStorage.getItem("vaani.theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  try { if (localStorage.getItem("vaani.rail") === "collapsed") document.documentElement.classList.add("rail-collapsed"); } catch (e) {}
  /* Vaani always opens in Voice mode (mode.js may fall back to Chat when voice is off). */
  document.documentElement.classList.add("mode-voice");
</script>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/shell.css">
<link rel="stylesheet" href="/static/brief.css">
<link rel="stylesheet" href="/static/settings.css">
<link rel="stylesheet" href="/static/stream.css">
<link rel="stylesheet" href="/static/history.css">
<link rel="stylesheet" href="/static/rail.css">
<link rel="stylesheet" href="/static/voice.css">
<link rel="stylesheet" href="/static/hud.css">
<link rel="stylesheet" href="/static/orb.css">
<link rel="stylesheet" href="/static/mode.css">
</head>
<body>
<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-inner">
    <div class="splash-mark">Vaani</div>
    <div class="splash-rule"></div>
    <p class="splash-tag">Your Gmail and Calendar, with a confirm step on every write.</p>
    <div class="splash-bar"><i></i></div>
    <p class="splash-status" id="splashStatus">SIGNING YOU IN</p>
  </div>
</div>
<a class="skip-link" href="#box">Skip to the message box</a>
<div class="app" id="app">
  <aside class="rail" id="rail" aria-label="Vaani menu">
    <button type="button" id="newBtn" class="new-pill">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>New chat</span>
    </button>
    <div class="rail-sections" id="railSections" aria-label="Sections"></div>
    <div class="rail-foot">
      <div class="rail-foot-row">
        <button type="button" id="settingsBtn" class="rail-row">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span>Settings</span>
        </button>
        <button type="button" id="railCollapse" class="icon-btn rail-collapse" aria-label="Collapse menu" title="Collapse menu">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 2.5v11" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </div>
      <div class="account" id="account">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <div class="who"><div id="acctName"></div><div id="acctEmail" class="muted"></div></div>
        <button type="button" id="signOut" class="ghost sm" hidden>Sign out</button>
      </div>
    </div>
  </aside>

  <div class="center">
    <header class="topbar">
      <div class="top-left">
        <button type="button" id="menuBtn" class="icon-btn" aria-controls="rail" aria-expanded="false" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4.5h14M2 9h14M2 13.5h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <span class="brand">Vaani</span>
      </div>
      <span id="modeSlotChat" class="mode-slot"></span>
      <span id="me" class="me" hidden>Connecting…</span>
      <div class="top-actions">
        <button type="button" id="briefBtn" class="top-btn" data-turn aria-label="Show the inbox brief" title="Inbox brief">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span class="top-label">Brief</span>
        </button>
        <button type="button" id="themeToggle" class="icon-btn top-icon" aria-label="Switch to dark theme" title="Switch theme">
          <svg class="i-moon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <svg class="i-sun" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.8" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>
    <div class="scroller" id="scroller">
      <div id="log" class="thread" role="log" aria-live="polite" aria-label="Conversation"></div>
    </div>
    <div class="composer-wrap">
      <button type="button" id="jumpBtn" class="jump-pill" hidden>
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2v8M2.5 6.5L6 10l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Jump to latest
      </button>
      <div class="composer-chips" id="composerChips" aria-label="Suggestions"></div>
      <form id="f" class="composer">
        <div class="composer-box">
          <label class="sr" for="box">Message to Vaani</label>
          <textarea id="box" rows="1" autocomplete="off" placeholder="Message Vaani" autofocus></textarea>
          <div class="composer-row">
            <div class="mic-slot" id="micSlot"></div>
            <button class="send-btn" id="send" type="submit" aria-label="Send">
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </form>
      <p class="composer-note">Nothing is sent or changed until you approve it · runs on a local model</p>
    </div>
    <footer class="strip" id="strip" aria-label="Last turn: model, time and tools" hidden></footer>
  </div>

  <aside class="drawer" id="drawer" aria-labelledby="drawerTitle" hidden>
    <div class="drawer-head">
      <h2 id="drawerTitle" tabindex="-1"></h2>
      <button type="button" id="drawerClose" class="icon-btn" aria-label="Close panel">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
</div>
<!-- Voice mode: the Jarvis-style HUD (hud.js builds it; contract .build/CONTRACT-v3.md). -->
<div id="hud" class="hud" aria-label="Vaani voice mode"></div>
<div class="scrim" id="scrim" hidden></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<dialog id="confirmDlg" aria-labelledby="dlgTitle" aria-describedby="dlgText">
  <form method="dialog">
    <h2 id="dlgTitle"></h2>
    <p id="dlgText"></p>
    <div class="actions">
      <button type="submit" value="cancel" id="dlgCancel" class="ghost">Cancel</button>
      <button type="submit" value="ok" id="dlgOk" class="danger">Confirm</button>
    </div>
  </form>
</dialog>

<!-- Load order matters: the hook bus first, feature files next, app.js last (see .build/CONTRACT-v2.md). -->
<script src="/static/vaani.js" defer></script>
<script src="/static/brief.js" defer></script>
<script src="/static/settings.js" defer></script>
<script src="/static/stream.js" defer></script>
<script src="/static/history.js" defer></script>
<script src="/static/rail.js" defer></script>
<script src="/static/voice.js" defer></script>
<script src="/static/cues.js" defer></script>
<script src="/static/orb.js" defer></script>
<script src="/static/hud.js" defer></script>
<script src="/static/handsfree.js" defer></script>
<script src="/static/mode.js" defer></script>
<script src="/static/app.js" defer onerror="var s=document.getElementById('splashStatus');if(s)s.textContent='Could not load /static/app.js: the server must serve the static/ folder at /static.'"></script>
<script>
  /* Never let the splash hide the page for long, even if a script failed to load. */
  setTimeout(function () { var s = document.getElementById("splash"); if (s) s.remove(); }, 12000);
</script>
</body>
</html>
