<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Vaani AI</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip-link" href="#box">Skip to the message box</a>
<div class="app" id="app">
  <aside class="rail" id="rail" aria-label="Vaani menu">
    <div class="wordmark">Vaani<span> AI</span></div>
    <nav class="rail-nav" aria-label="Main">
      <button type="button" id="newBtn" class="rail-btn">New chat</button>
      <button type="button" id="briefBtn" class="rail-btn" data-turn>Brief</button>
      <button type="button" id="followBtn" class="rail-btn" data-panel="followups" aria-controls="drawer" aria-expanded="false" hidden>Follow-ups <span class="badge" id="followCount" hidden></span></button>
      <button type="button" id="autonomyBtn" class="rail-btn" data-panel="autonomy" aria-controls="drawer" aria-expanded="false" hidden>Autonomy</button>
      <button type="button" id="proofBtn" class="rail-btn" data-panel="proof" aria-controls="drawer" aria-expanded="false" hidden>Proof</button>
    </nav>
    <div class="account" id="account">
      <span class="avatar" id="avatar" aria-hidden="true"></span>
      <div class="who"><div id="acctName"></div><div id="acctEmail" class="muted"></div></div>
      <button type="button" id="signOut" class="ghost sm" hidden>Sign out</button>
    </div>
  </aside>

  <div class="center">
    <header class="topbar">
      <button type="button" id="menuBtn" class="icon-btn" aria-controls="rail" aria-expanded="false" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4.5h14M2 9h14M2 13.5h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <span class="brand">Vaani AI</span>
      <span id="me" class="me">Connecting…</span>
    </header>
    <div class="scroller" id="scroller">
      <div id="log" class="thread" role="log" aria-live="polite" aria-label="Conversation"></div>
    </div>
    <form id="f" class="composer">
      <div class="composer-inner">
        <label class="sr" for="box">Message to Vaani</label>
        <input id="box" autocomplete="off" placeholder="Ask Vaani: check my latest emails, reply to someone, or brief my day" autofocus>
        <button class="primary" id="send" type="submit">Send</button>
      </div>
    </form>
    <footer class="strip" id="strip" aria-label="Last turn: model, time and tools"></footer>
  </div>

  <aside class="drawer" id="drawer" aria-labelledby="drawerTitle" hidden>
    <div class="drawer-head">
      <h2 id="drawerTitle" tabindex="-1"></h2>
      <button type="button" id="drawerClose" class="icon-btn" aria-label="Close panel">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
</div>
<div class="scrim" id="scrim" hidden></div>

<dialog id="confirmDlg" aria-labelledby="dlgTitle" aria-describedby="dlgText">
  <form method="dialog">
    <h2 id="dlgTitle"></h2>
    <p id="dlgText"></p>
    <div class="actions">
      <button type="submit" value="cancel" id="dlgCancel" class="ghost">Cancel</button>
      <button type="submit" value="ok" id="dlgOk" class="danger">Confirm</button>
    </div>
  </form>
</dialog>

<script src="/static/app.js" defer onerror="document.getElementById('me').textContent='Could not load /static/app.js: the server must serve the static/ folder at /static.'"></script>
</body>
</html>
