<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaani AI</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#6b7280; --line:#e3e6ea; --me:#dbeafe; --accent:#2563eb; --ok:#16a34a; --warn:#b45309; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); font-size:13px; color:var(--muted); }
  header .brand { font-weight:600; font-size:15px; color:var(--ink); white-space:nowrap; }
  header #me { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:6px 12px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  main { max-width:820px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:12px; min-height:calc(100vh - 120px); }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--me); border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .bot { white-space:normal; }
  .bot p { margin:0; } .bot p + p, .bot p + ol, .bot p + ul, .bot ol + p, .bot ul + p { margin-top:8px; }
  .bot ol, .bot ul { margin:4px 0 0; padding-left:22px; } .bot li { margin:2px 0; }
  .bot li > ul, .bot li > ol { margin-top:2px; padding-left:18px; } .bot li > ul { list-style:disc; }
  .footer { align-self:flex-start; font-size:12px; color:var(--muted); margin:-6px 0 0 6px; }
  .footer.err { color:var(--warn); }
  .card { align-self:flex-start; background:var(--card); border:1px solid var(--accent); border-radius:12px; padding:12px 14px; max-width:85%; }
  .card h4 { margin:0 0 6px; font-size:14px; } .card div { margin:2px 0; } .card .small { color:var(--muted); font-size:12px; }
  .card .actions { margin-top:10px; display:flex; gap:8px; }
  .card.danger { border-color:#dc2626; } button.danger { background:#dc2626; border-color:#dc2626; }
  .card .mailbody { white-space:pre-wrap; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:6px 0; max-height:260px; overflow:auto; font-size:14px; }
  .spin { align-self:flex-start; color:var(--muted); font-size:13px; }
  .spin::before { content:""; display:inline-block; width:12px; height:12px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; margin-right:8px; vertical-align:-2px; animation:r .8s linear infinite; }
  @keyframes r { to { transform:rotate(360deg); } }
  form { position:sticky; bottom:0; display:flex; gap:8px; padding:12px 16px; background:var(--bg); border-top:1px solid var(--line); }
  input { flex:1; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); }
  a { color:var(--accent); }
</style>
</head>
<body>
<header><span class="brand">Vaani AI</span><span id="me">Connecting…</span><button id="newBtn" type="button">New chat</button></header>
<main id="log"></main>
<form id="f"><input id="box" autocomplete="off" placeholder="Ask Vaani: check my latest emails, reply to someone, or brief my day" autofocus><button class="primary" id="send" type="submit">Send</button></form>
<script>
const $ = s => document.querySelector(s);
const log = $("#log"), box = $("#box"), send = $("#send");
let sessionId = null, busy = false, me = null;

async function api(path, body) {
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `${path} failed (${r.status})`);
  return j;
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; log.appendChild(e); return e; }
function scroll() { window.scrollTo(0, document.body.scrollHeight); }

const URL_RE = /(https:\/\/(?:www\.google\.com\/calendar\/[^\s)\]]+|calendar\.google\.com\/[^\s)\]]+))/g;
const IS_CAL = /^https:\/\/(?:www\.google\.com\/calendar\/|calendar\.google\.com\/)/;
// Replies arrive as light markdown from the model. Render a safe subset by building DOM
// nodes (never innerHTML): **bold**, numbered / bulleted lists, paragraphs, [label](url)
// links and bare URLs. Calendar links get a fixed label so a mangled URL is never shown.
const INLINE_RE = /\*\*([^*\n]+)\*\*|\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>)\]]+)/g;
function anchor(url, label) {
  const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener";
  a.textContent = IS_CAL.test(url) ? "Open in Google Calendar" : label; return a;
}
function inline(target, text) {
  let last = 0; INLINE_RE.lastIndex = 0;
  for (const m of text.matchAll(INLINE_RE)) {
    if (m.index > last) target.appendChild(document.createTextNode(text.slice(last, m.index)));
    if (m[1] != null) { const b = document.createElement("strong"); inline(b, m[1]); target.appendChild(b); }
    else if (m[2] != null) target.appendChild(anchor(m[3], m[2]));
    else target.appendChild(anchor(m[4], m[4].replace(/[.,;:!?]+$/, "")));
    last = m.index + m[0].length;
  }
  if (last < text.length) target.appendChild(document.createTextNode(text.slice(last)));
}
const LIST_RE = /^(\s*)(?:(\d+)[.)]|[-*•])\s+(.*)$/;
// Lists: "1. Item" opens / continues an ordered list and keeps the model's own number (li.value),
// so a list interrupted by sub-bullets never restarts at 1. A bullet that is indented, or that
// follows a numbered item, is nested inside that item. A plain line ends the list.
function renderReply(target, text) {
  const lines = String(text || "").replace(/\r/g, "").split("\n");
  let top = null, sub = null, lastLi = null, para = null;
  const make = tag => document.createElement(tag);
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, "");
    if (!line.trim()) { para = null; continue; }   // blank line: lists stay open, paragraphs end
    const m = line.match(LIST_RE);
    if (m) {
      const indent = m[1].replace(/\t/g, "  ").length, numbered = m[2] != null, tag = numbered ? "ol" : "ul";
      const li = make("li");
      if (numbered) li.value = parseInt(m[2], 10);
      inline(li, m[3]);
      para = null;
      const nest = lastLi && (indent >= 2 || (!numbered && top && top.tagName === "OL"));
      if (nest) {
        if (!sub || sub.tagName.toLowerCase() !== tag || sub.parentNode !== lastLi) { sub = make(tag); lastLi.appendChild(sub); }
        sub.appendChild(li);
        continue;
      }
      if (!top || top.tagName.toLowerCase() !== tag) { top = make(tag); target.appendChild(top); }
      top.appendChild(li); lastLi = li; sub = null;
      continue;
    }
    top = sub = lastLi = null;
    if (!para) { para = make("p"); target.appendChild(para); }
    else para.appendChild(make("br"));
    inline(para, line.replace(/^#{1,6}\s+/, ""));
  }
}

function fmt(iso) {
  const d = new Date(iso); if (isNaN(d)) return iso;
  return d.toLocaleString("en-GB", {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit", timeZone: me && me.tz || undefined});
}

function draftCard(d) {
  // Only the newest card can be confirmed (the server refuses older ones too).
  for (const old of log.querySelectorAll(".card.live")) {
    old.classList.remove("live");
    old.querySelectorAll("button").forEach(b => b.disabled = true);
    old.querySelector(".actions").appendChild(Object.assign(document.createElement("span"), {className:"small", textContent:" Replaced by a newer card"}));
  }
  const k = d.card || {title: `Draft: ${d.summary}`, lines: [], confirm_label: "Confirm", note: ""};
  const c = el("div", "card live" + (k.danger ? " danger" : ""));
  c.appendChild(Object.assign(document.createElement("h4"), {textContent: k.title}));
  const row = (t, cls) => { const x = document.createElement("div"); if (cls) x.className = cls; x.textContent = t; c.appendChild(x); return x; };
  for (const line of k.lines || []) row(line);
  if (k.body) row(k.body, "mailbody");
  if (k.note) row(k.note, "small");
  const actions = document.createElement("div"); actions.className = "actions";
  const ok = document.createElement("button"); ok.className = k.danger ? "primary danger" : "primary"; ok.textContent = k.confirm_label || "Confirm";
  const buttons = [ok];
  let alt = null;
  if (k.alt) { alt = document.createElement("button"); alt.textContent = k.alt.label; buttons.push(alt); }
  const no = document.createElement("button"); no.textContent = "Cancel"; buttons.push(no);
  actions.append(...buttons); c.appendChild(actions);
  const done = label => { c.classList.remove("live"); buttons.forEach(b => b.disabled = true); actions.appendChild(Object.assign(document.createElement("span"), {className:"small", textContent: ` ${label}`})); };
  // Check busy BEFORE marking the card done: a click during an in-flight request must change nothing.
  ok.onclick = () => { if (busy) return; done(ok.textContent); turn({confirm_draft_id: d.draft_id}, ok.textContent); };
  if (alt) alt.onclick = () => { if (busy) return; done(alt.textContent); turn({confirm_draft_id: d.draft_id, confirm_variant: k.alt.variant}, alt.textContent); };
  no.onclick = () => { if (busy) return; done("Cancelled"); turn({cancel_draft_id: d.draft_id}, "Cancel"); };
  return c;
}

function setBusy(b) {
  busy = b; box.disabled = b; send.disabled = b; $("#newBtn").disabled = b;
  log.querySelectorAll(".card.live button").forEach(x => x.disabled = b);
  if (!b) box.focus();
}

async function turn(payload, label) {
  if (busy || !sessionId) return;
  setBusy(true);
  el("div", "msg user", label);
  const spin = el("div", "spin", "thinking… 0.0s");
  const t0 = performance.now();
  const tick = setInterval(() => spin.textContent = `thinking… ${((performance.now() - t0) / 1000).toFixed(1)}s`, 100);
  try {
    const r = await api("/chat", Object.assign({session_id: sessionId}, payload));
    spin.remove();
    renderReply(el("div", "msg bot"), r.reply);
    const failed = (r.tool_calls || []).filter(t => !t.ok).length;
    el("div", "footer" + (failed ? " err" : ""), r.footer + (failed ? ` · ${failed} tool error(s)` : ""));
    if (r.pending_draft) draftCard(r.pending_draft);
  } catch (e) {
    spin.remove();
    el("div", "msg bot", `Request failed: ${e.message}`);
    if (/unknown session/.test(e.message)) await newChat();
  } finally { clearInterval(tick); setBusy(false); scroll(); }
}

async function newChat() {
  log.textContent = "";
  try { sessionId = (await api("/new", {})).session_id; el("div", "footer", `New chat ${sessionId}`); }
  catch (e) { el("div", "msg bot", `Could not start a chat: ${e.message}`); }
}

$("#f").onsubmit = e => { e.preventDefault(); const t = box.value.trim(); if (!t) return; box.value = ""; turn({text: t}, t); };
$("#newBtn").onclick = () => { if (!busy) newChat(); };

(async () => {
  try {
    me = await api("/me");
    $("#me").textContent = `Connected as ${me.email} · ${me.scopes.join(", ")} · model: ${me.model} (local) · now: ${me.now} ${me.tz}`;
    if (me.model_present === false) $("#me").textContent += " · WARNING: model not loaded";
  } catch (e) { $("#me").textContent = `Not connected: ${e.message}`; }
  await newChat();
})();
</script>
</body>
</html>
