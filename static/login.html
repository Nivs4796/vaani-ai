<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Sign in · Vaani AI</title>
<!-- Light by default whatever the OS says; a saved "dark" choice applies before the first paint. -->
<script>try { const t = localStorage.getItem("vaani.theme"); if (t === "dark") document.documentElement.dataset.theme = "dark"; } catch (_) {}</script>
<link rel="preload" href="/static/fonts/dm-sans-400-600-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/instrument-serif-400-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login" data-page="login">
<main class="login-card">
  <h1 class="wordmark">Vaani</h1>
  <p class="tagline">Your Gmail and Calendar, with a confirm step on every write.</p>
  <p class="login-error" id="loginError" role="alert" hidden></p>
  <form method="get" action="/auth/login">
    <button type="submit" class="google-btn">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Sign in with Google
    </button>
  </form>
  <h2 class="perm-head">Vaani asks Google for two permissions</h2>
  <ul class="perms">
    <li><strong>Gmail</strong><span>Read, send, label and trash mail (never permanent delete)</span></li>
    <li><strong>Calendar</strong><span>Read and change your calendar events</span></li>
  </ul>
</main>
<script src="/static/app.js" defer></script>
</body>
</html>
